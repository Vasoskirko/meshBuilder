name: Extract bundle builder UI
on:
  push:
    branches: [refactor/bundle-builder-ui]
    paths: [.github/workflows/extract-bundle-ui.yml]
permissions:
  contents: write
concurrency:
  group: extract-bundle-builder-ui
  cancel-in-progress: false
jobs:
  extract:
    if: github.repository == 'Vasoskirko/meshBuilder' && github.ref == 'refs/heads/refactor/bundle-builder-ui'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
      MPLBACKEND: QtAgg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mechanically extract unchanged UI methods
        run: |
          python - <<'PY'
          import ast
          import builtins
          import copy
          import hashlib
          from pathlib import Path
          import symtable
          source = Path('bundle_subchannel_builder.py')
          target = Path('bundle_builder_ui.py')
          raw = source.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob == 'a3f4404f6a594578eceb6f4160d79c34458488d2', 'Source SHA changed; refusing extraction'
          assert not target.exists(), 'Target module already exists'
          text = raw.decode('utf-8')
          tree = ast.parse(text)
          classes = [n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'BundleBuilderWindow']
          assert len(classes) == 1, 'Unexpected class layout'
          cls = classes[0]
          names = {'init_ui', 'add_double_spin'}
          moved = [n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name in names]
          assert len(moved) == 2 and {n.name for n in moved} == names
          assert not cls.decorator_list
          for node in moved:
              assert not any(isinstance(n, ast.Name) and n.id in ('super', '__class__') for n in ast.walk(node)), 'Class-sensitive method requires manual review'
          symbols = symtable.symtable(text, str(source), 'exec')
          class_symbols = [s for s in symbols.get_children() if s.get_name() == cls.name]
          assert len(class_symbols) == 1
          globals_used = set()
          def collect_globals(table):
              globals_used.update(s.get_name() for s in table.get_symbols() if s.is_global() and s.is_referenced())
              for child in table.get_children():
                  collect_globals(child)
          for table in class_symbols[0].get_children():
              if table.get_name() in names:
                  collect_globals(table)
          imports = []
          provided = set()
          for node in tree.body:
              if isinstance(node, (ast.Import, ast.ImportFrom)):
                  assert not any(a.name == '*' for a in node.names), 'Wildcard import requires manual review'
                  selected = []
                  for alias in node.names:
                      bound = alias.asname or (alias.name.split('.')[0] if isinstance(node, ast.Import) else alias.name)
                      if bound in globals_used:
                          selected.append(copy.deepcopy(alias))
                          provided.add(bound)
                  if selected:
                      item = copy.deepcopy(node)
                      item.names = selected
                      imports.append(ast.unparse(item))
          unresolved = globals_used - provided - set(dir(builtins))
          assert not unresolved, 'Unresolved UI globals: ' + repr(sorted(unresolved))
          assert all('bundle_subchannel_builder' not in line for line in imports), 'Circular import'
          lines = text.splitlines(keepends=True)
          spans = []
          chunks = []
          for node in moved:
              start = min([node.lineno] + [d.lineno for d in node.decorator_list]) - 1
              spans.append((start, node.end_lineno))
              chunks.append(''.join(lines[start:node.end_lineno]).rstrip('\r\n'))
          new_module = '# -*- coding: utf-8 -*-\n' + '"""UI construction mixin; mechanically extracted without behaviour changes."""\n' + '\n'.join(imports) + '\n\n\nclass BundleBuilderUiMixin:\n' + '\n\n'.join(chunks) + '\n'
          assert len(new_module.encode('utf-8')) <= 28000, 'UI module exceeds readable size bound'
          for start, end in sorted(spans, reverse=True):
              del lines[start:end]
          remainder = ''.join(lines)
          marker = 'class BundleBuilderWindow(QMainWindow):'
          replacement = 'from bundle_builder_ui import BundleBuilderUiMixin\n\n\nclass BundleBuilderWindow(BundleBuilderUiMixin, QMainWindow):'
          assert remainder.count(marker) == 1, 'Unexpected inheritance declaration'
          remainder = remainder.replace(marker, replacement, 1)
          new_tree = ast.parse(remainder)
          ui_tree = ast.parse(new_module)
          ui_classes = [n for n in ui_tree.body if isinstance(n, ast.ClassDef)]
          assert len(ui_classes) == 1
          ui_methods = {n.name: n for n in ui_classes[0].body if isinstance(n, ast.FunctionDef)}
          for node in moved:
              assert ast.dump(node, include_attributes=False) == ast.dump(ui_methods[node.name], include_attributes=False), 'Moved method changed'
          expected = copy.deepcopy(tree)
          expected_class = next(n for n in expected.body if isinstance(n, ast.ClassDef) and n.name == cls.name)
          expected_class.body = [n for n in expected_class.body if not (isinstance(n, ast.FunctionDef) and n.name in names)]
          expected_class.bases.insert(0, ast.Name(id='BundleBuilderUiMixin', ctx=ast.Load()))
          expected.body.insert(expected.body.index(expected_class), ast.parse('from bundle_builder_ui import BundleBuilderUiMixin').body[0])
          assert ast.dump(expected, include_attributes=False) == ast.dump(new_tree, include_attributes=False), 'Unrelated source AST changed'
          compile(new_module, str(target), 'exec')
          compile(remainder, str(source), 'exec')
          target.write_text(new_module, encoding='utf-8')
          source.write_text(remainder, encoding='utf-8')
          PY
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements.txt
      - name: Run regression and offscreen window tests
        run: python -m unittest discover -s tests -v
      - name: Commit extracted sources only and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bundle_subchannel_builder.py bundle_builder_ui.py
          git rm -- .github/workflows/extract-bundle-ui.yml
          git diff --cached --check
          git commit -m 'Extract unchanged bundle builder UI into a dedicated mixin'
          git push origin HEAD:refs/heads/refactor/bundle-builder-ui
