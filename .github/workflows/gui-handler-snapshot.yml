name: Snapshot GUI handlers for audit
on:
  push:
    branches: [audit/gui-state-invalidation]
    paths: [.github/workflows/gui-handler-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: gui-handler-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.repository == 'Vasoskirko/meshBuilder' && github.ref == 'refs/heads/audit/gui-state-invalidation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract complete handlers without importing application code
        run: |
          python - <<'PY'
          import ast
          import hashlib
          from pathlib import Path
          import subprocess
          baseline = 'bb8a4e39f7f11dc6f6edff8cd616348f3375b8b8'
          targets = [
              ('mesh_subchannel_subpanel.py', 'MeshSubpanel', ['on_field_changed', 'save_current_ui_to_active_scope']),
              ('bundle_subchannel_builder.py', 'BundleBuilderWindow', ['on_build_layer_only', 'on_fill_core_clicked', 'on_build_multiblock_mesh', 'on_export_plot3d', 'on_export_starccm_dialog']),
          ]
          out = Path('docs/audit/gui-state')
          if out.exists():
              raise SystemExit('Refusing to overwrite existing audit directory')
          pending = {}
          index = ['# GUI handler source audit', '', 'Baseline: `' + baseline + '`.', '', 'Static source snapshots only. No runtime GUI or signal behaviour is certified.', '']
          connections = ['# Signal connections', '', 'Static expressions only; not proof of runtime execution.', '']
          for filename, classname, names in targets:
              raw = Path(filename).read_bytes()
              original = subprocess.check_output(['git', 'show', baseline + ':' + filename])
              if raw != original:
                  raise SystemExit('Source changed since baseline: ' + filename)
              text = raw.decode('utf-8')
              lines = text.splitlines()
              tree = ast.parse(text, filename=filename)
              classes = [n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == classname]
              if len(classes) != 1:
                  raise SystemExit('Unexpected class layout: ' + classname)
              methods = {}
              for node in classes[0].body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      methods.setdefault(node.name, []).append(node)
              sha = hashlib.sha256(raw).hexdigest()
              for name in names:
                  matches = methods.get(name, [])
                  if len(matches) != 1:
                      raise SystemExit('Missing or duplicate handler: ' + classname + '.' + name)
                  node = matches[0]
                  start = min([node.lineno] + [d.lineno for d in node.decorator_list])
                  code = '\n'.join(line.rstrip() for line in lines[start - 1:node.end_lineno])
                  header = '# ' + classname + '.' + name + '\n\n'
                  meta = 'Source: `' + filename + '`, lines ' + str(start) + '-' + str(node.end_lineno) + '.\n\nSHA-256: `' + sha + '`.\n\n'
                  content = header + meta + '```python\n' + code + '\n```\n'
                  if len(content.encode('utf-8')) > 20000:
                      raise SystemExit('Handler exceeds bounded report size: ' + name)
                  report_name = classname + '.' + name + '.md'
                  pending[report_name] = content
                  index.append('- `' + report_name + '`: ' + str(node.end_lineno - start + 1) + ' lines.')
              connections.extend(['## ' + filename, ''])
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr in ('connect', 'mpl_connect'):
                      expression = ast.unparse(node)
                      tokens = ('on_field_changed', 'on_core_mode_changed', 'invalidate', 'on_build', 'on_fill', 'on_export', 'on_check_quality')
                      if any(token in expression for token in tokens):
                          connections.append('- Line ' + str(node.lineno) + ': `' + expression + '`')
              connections.append('')
          pending['index.md'] = '\n'.join(index) + '\n'
          pending['connections.md'] = '\n'.join(connections) + '\n'
          if any(len(content.encode('utf-8')) > 20000 for content in pending.values()):
              raise SystemExit('Report exceeds bounded size')
          out.mkdir(parents=True)
          for name, content in pending.items():
              (out / name).write_text(content, encoding='utf-8')
          PY
      - name: Commit audit reports only and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/audit/gui-state/
          git rm -- .github/workflows/gui-handler-snapshot.yml
          git diff --cached --check
          git commit -m 'Record bounded GUI handler snapshots for state audit'
          git push origin HEAD:refs/heads/audit/gui-state-invalidation
