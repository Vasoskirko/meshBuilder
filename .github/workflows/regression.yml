name: Regression audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
      MPLBACKEND: QtAgg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements.txt
      - name: Inventory all tracked Python files
        run: |
          python - <<'PY'
          import ast, csv, pathlib, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          paths = subprocess.check_output(['git', 'ls-files', '*.py'], text=True).splitlines()
          with open('file_inventory.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(['commit', 'path', 'bytes', 'lines', 'classes', 'functions', 'manual_review'])
              for name in paths:
                  p = pathlib.Path(name)
                  text = p.read_text(encoding='utf-8')
                  tree = ast.parse(text)
                  w.writerow([sha, name, p.stat().st_size, len(text.splitlines()), sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree)), sum(isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) for n in ast.walk(tree)), 'not_certified'])
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-inventory
          path: file_inventory.csv
