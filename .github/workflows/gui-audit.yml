name: GUI static audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare complete GUI sources
        run: python tools/gui_audit.py --output gui_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: gui-static-audit
          path: gui_audit.json
          if-no-files-found: error
